name: Alexa HA Config
version: "1.0.0"
slug: alexa_ha_config
description: "Choose exactly which entities Home Assistant exposes to Amazon Alexa. Requires the Alexa (smart_home) integration."
url: "https://github.com/jasimancas/Alexa-HA-Config"
image: ghcr.io/jasimancas/alexa-ha-config-{arch}

arch:
  - amd64
  - aarch64

startup: application
boot: auto
init: false # run.sh supervises nginx + Next.js and exits if either dies

# UI is only reachable through Home Assistant Ingress (no host ports)
ingress: true
ingress_port: 8080
watchdog: "tcp://[HOST]:[PORT:8080]"

panel_icon: mdi:account-voice
panel_title: Alexa HA Config
# The add-on edits configuration.yaml and can restart Home Assistant
panel_admin: true

# Least privilege: "homeassistant" role allows /core/check and /core/restart
hassio_api: true
hassio_role: homeassistant
homeassistant_api: true # WebSocket API via http://supervisor/core/websocket

map:
  - homeassistant_config:rw # mounted at /homeassistant

homeassistant: "2024.1.0"

options:
  ha_websocket_url: "http://supervisor/core/websocket"
  ha_access_token: ""
  ha_entity_domains:
    - "switch"
    - "scene"
    - "sensor"
    - "binary_sensor"
    - "light"
    - "climate"
    - "button"
    - "automation"
schema:
  ha_websocket_url: url
  ha_access_token: password
  ha_entity_domains:
    - str
