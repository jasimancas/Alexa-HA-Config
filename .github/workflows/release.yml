name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE_REPO: ghcr.io/jasimancas/alexa-ha-config

jobs:
  build-and-push:
    name: Build and Push Docker Images
    # Native runner per architecture: no QEMU emulation (slow and can hang)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch:
          - amd64
          - aarch64
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check tag matches config.yml version
        run: |
          CONFIG_VERSION=$(sed -n 's/^version: "\(.*\)"/\1/p' config.yml)
          if [ "$CONFIG_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag v${{ steps.version.outputs.VERSION }} does not match config.yml version $CONFIG_VERSION"
            exit 1
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ${{ env.IMAGE_REPO }}-${{ matrix.arch }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_REPO }}-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for version
        id: changelog
        run: |
          # Extract the changelog section for this version
          VERSION=${{ steps.version.outputs.VERSION }}
          CHANGELOG=$(awk "/^## \[${VERSION}\]/,/^## \[/" CHANGELOG.md | head -n -1)
          # Handle multiline output
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Docker Images

            This release includes pre-built Docker images for all supported architectures:

            - `${{ env.IMAGE_REPO }}-amd64:${{ steps.version.outputs.VERSION }}`
            - `${{ env.IMAGE_REPO }}-aarch64:${{ steps.version.outputs.VERSION }}`

            ## Installation

            Add this repository to your Home Assistant add-on store:
            ```
            https://github.com/jasimancas/Alexa-HA-Config
            ```
          draft: false
          prerelease: false
